<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayder Card | متجر بطاقاتك الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-color: #00d4ff; 
            --bg-dark: #0f172a;    
            --card-bg: #1e293b;    
            --whatsapp-green: #25D366;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--main-color);
        }
        .logo {
            font-size: 35px;
            font-weight: 900;
            color: var(--main-color);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--main-color);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .btn-order {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            gap: 10px;
        }
        footer {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AYDER CARD</div>
        <p>بوابتك لعالم البطاقات الرقمية</p>
    </header>

    <div class="container">
        <div class="grid">
            
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" alt="Game Card">
                <div class="card-content">
                    <h3>Game Card</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_Game_Card" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=500" alt="PlayStation">
                <div class="card-content">
                    <h3>PlayStation</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_بطاقة_PlayStation" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=500" alt="Steam">
                <div class="card-content">
                    <h3>Steam</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_بطاقة_Steam" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=500" alt="Shahid">
                <div class="card-content">
                    <h3>Shahid VIP</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_اشتراك_Shahid" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1621259182978-f09e5e2ca1ff?w=500" alt="Xbox">
                <div class="card-content">
                    <h3>Xbox</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_بطاقة_Xbox" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=500" alt="Netflix">
                <div class="card-content">
                    <h3>Netflix</h3>
                    <a href="https://wa.me/97339169986?text=أريد_طلب_اشتراك_Netflix" class="btn-order">
                        <i class="fab fa-whatsapp"></i> اطلب الآن
                    </a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ayder Card. جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
